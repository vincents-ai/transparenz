version: "2"
run:
  timeout: 5m
linters:
  enable:
    - gosec
    - govet
    - errcheck
    - staticcheck
    - revive
    - unused
    - gocritic
  settings:
    revive:
      rules:
        - name: unused-parameter
          disabled: true
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: var-naming
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
formatters:
  enable:
    - gofmt
